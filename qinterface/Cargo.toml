[package]
name = "qinterface"
version = "0.6.0"
edition.workspace = true
description = "dquic's network interface and IO abstractions"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes = { workspace = true }
dashmap = { workspace = true }
derive_more = { workspace = true, features = ["deref"] }
futures = { workspace = true }
http = { workspace = true }
netdev = { workspace = true }
netwatcher = { workspace = true, optional = true }
parking_lot = { workspace = true }
qbase = { workspace = true }
qevent = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(any(unix, windows))'.dependencies]
qudp = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = [
    "test-util",
    "macros",
    "rt-multi-thread",
] }

[features]
netwatcher = ["dep:netwatcher"]
qudp = ["dep:qudp"]
