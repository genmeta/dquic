[package]
name = "qtls"
version = "0.1.0"
edition.workspace = true
description = "Connection-independent QUIC TLS 1.3 state machine for dquic"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
bytes = { workspace = true }
der = "0.8"
pkix-path = { version = "0.3.2", default-features = false, features = ["std"] }
pkix-revocation = { version = "0.3.3", default-features = false, features = ["ocsp"] }
ring = { workspace = true, optional = true }
aws-lc-rs = { version = "1.12", optional = true, default-features = false }
rustls = { package = "qrustls", version = "=0.23.45", default-features = false, features = ["std"] }
signature = "3"
spki = "0.8"
thiserror = { workspace = true }
x509-cert = "0.3"
x509-parser = { workspace = true }
zeroize = "1.7"

# pkix 0.3 still exposes the previous RustCrypto types in its public API.
pkix-signature = { package = "signature", version = "2" }
pkix-x509-cert = { package = "x509-cert", version = "0.2" }

[features]
default = ["ring"]
ring = ["dep:ring", "rustls/ring"]
aws-lc-rs = ["dep:aws-lc-rs", "rustls/aws_lc_rs"]
fips = ["aws-lc-rs", "aws-lc-rs/fips", "rustls/fips"]
