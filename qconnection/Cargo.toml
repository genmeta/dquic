[package]
name = "qconnection"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Sequential QUIC handshake growth on qtls and qtransport"

[dependencies]
bytes.workspace = true
futures.workspace = true
qbase.workspace = true
qcongestion.workspace = true
qprotocol.workspace = true
qrecovery.workspace = true
qresolve.workspace = true
qtls.workspace = true
qtransport.workspace = true
qtraversal.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "io-util"] }
tracing.workspace = true

[dev-dependencies]
clap.workspace = true
netdev.workspace = true
qudp.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
tls-backend = { package = "qrustls", version = "=0.23.45", default-features = false, features = ["std", "ring"] }
