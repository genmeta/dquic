[package]
name = "qconnection"
version = "0.7.0-beta.2"
edition.workspace = true
description = "Encapsulation of QUIC connections, a part of dquic"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = { workspace = true }
dashmap = { workspace = true }
derive_more = { workspace = true, features = [
    "as_ref",
    "deref",
    "display",
    "from",
] }
enum_dispatch = { workspace = true }
futures = { workspace = true }
qbase = { workspace = true }
qcongestion = { workspace = true }
qresolve = { workspace = true }
qevent = { workspace = true }
qrecovery = { workspace = true }
ring = { workspace = true }
qtraversal = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
qinterface = { workspace = true }
x509-parser = { workspace = true }

[target.'cfg(any(unix, windows))'.dependencies]
qinterface = { workspace = true, features = ["qudp"] }

# features: datagram
qdatagram = { workspace = true, optional = true }

[features]
default = ["datagram"]
datagram = ["dep:qdatagram"]
netwatcher = ["qinterface/netwatcher"]
telemetry = ["qevent/telemetry"]

[dev-dependencies]
rustls = { workspace = true, features = ["ring"] }
