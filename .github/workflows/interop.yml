name: QUIC interop

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      measurements:
        description: Also run goodput and TCP cross-traffic measurements
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Body-only edits must not cancel a running test of the same PR.
  group: interop-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.title == null && 'metadata' || 'tests' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  regression:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.title, '[interop]') &&
      (github.event.action != 'edited' || github.event.changes.title != null))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Test result validation
        run: python3 -m unittest discover -s dquic/interop -p 'test_*.py' -v
      - name: Test PR comments
        run: node --test dquic/interop/test_comment.cjs
      - name: Test workspace with default OCSP policy
        run: cargo test --workspace -- --test-threads=1
      - name: Test workspace with required OCSP staples
        run: cargo test --workspace --features dquic/ocsp-must-staple -- --test-threads=1

  image:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.title, '[interop]') &&
      (github.event.action != 'edited' || github.event.changes.title != null))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build endpoint image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dquic/interop/Dockerfile
          platforms: linux/amd64
          tags: dquic-interop:local
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/dquic-interop.tar
          cache-from: type=gha,scope=interop
          cache-to: type=gha,scope=interop,mode=max
      - name: Compress image
        run: zstd -T0 "$RUNNER_TEMP/dquic-interop.tar" -o "$RUNNER_TEMP/dquic-interop.tar.zst"
      - uses: actions/upload-artifact@v6
        with:
          name: interop-image
          path: ${{ runner.temp }}/dquic-interop.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  interop:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        peer: [quic-go, ngtcp2, msquic, quinn, aioquic]
    steps:
      - uses: actions/checkout@v6
      - name: Check out official Interop Runner
        uses: actions/checkout@v6
        with:
          repository: quic-interop/quic-interop-runner
          ref: ee53e50e1ed33b7871bf67bdb0a7de7d173dd8bb
          path: target/interop-runner
      # The Runner's compose file requires interface_name and modern IPv6 support.
      - uses: docker/setup-docker-action@v5
        with:
          version: v28.3.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: interop-image
          path: ${{ runner.temp }}
      - name: Load endpoint image
        run: docker load --input "$RUNNER_TEMP/dquic-interop.tar.zst"
      - name: Install packet analysis and Runner dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo modprobe ip6table_filter
          sudo add-apt-repository -y ppa:wireshark-dev/nightly
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tshark
          python -m pip install -r target/interop-runner/requirements.txt
          mkdir -p target/interop
          tshark --version > target/interop/tshark-version.txt
          docker version > target/interop/docker-version.txt
          docker compose version >> target/interop/docker-version.txt
          git -C target/interop-runner rev-parse HEAD > target/interop/runner-revision.txt
      - name: Run both directions
        env:
          PEER: ${{ matrix.peer }}
          MEASUREMENTS: ${{ inputs.measurements || false }}
        run: |
          options=()
          if [[ "$MEASUREMENTS" == true ]]; then options+=(--measurements); fi
          python dquic/interop/ci.py target/interop-runner "$PEER" "${options[@]}"
      - name: Upload JSON results for PR reporting
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: interop-results-${{ matrix.peer }}
          path: target/interop/*_*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload results, logs, packet captures and key logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: interop-${{ matrix.peer }}
          path: target/interop/
          retention-days: 7
          if-no-files-found: warn

  report:
    needs: [regression, image, interop]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.title, '[interop]') &&
      (github.event.action != 'edited' || github.event.changes.title != null)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: interop-results-*
          path: target/interop-results
      - name: Collect run and job metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/interop-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs' > target/interop-jobs.json
      - name: Render functional test report
        run: |
          python3 dquic/interop/report.py target/interop-results \
            --run target/interop-run.json --jobs target/interop-jobs.json \
            --output target/interop-report.md
      - uses: actions/upload-artifact@v6
        with:
          name: interop-report
          path: |
            target/interop-report.md
            target/interop-run.json
            target/interop-jobs.json
            target/interop-results/
          retention-days: 7
          if-no-files-found: error
