[package]
name = "h3-shim"
version = "0.5.0"
edition.workspace = true
description = "Shim libray between dquic and h3"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

autoexamples = false

[dependencies]
h3 = { workspace = true }
h3-datagram = { workspace = true, optional = true }
bytes = { workspace = true }
futures = { workspace = true }
dquic = { workspace = true }
tokio = { workspace = true }

[features]
datagram = ["dep:h3-datagram", "dquic/datagram"]
telemetry = ["dquic/telemetry"]

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
http = { workspace = true }
indicatif = { workspace = true }
qevent = { workspace = true, features = ["telemetry"] }
rustls = { workspace = true, features = ["logging", "ring"] }
rustls-native-certs = { workspace = true }
tokio = { workspace = true, features = ["io-std", "fs", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }

# console-subscriber = "0.4"

[dev-dependencies.tracing-subscriber]
workspace = true
features = ["env-filter", "time"]

[[example]]
name = "h3-server"

[[example]]
name = "h3-client"
