[package]
name = "qtransport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Established QUIC connections and composable packet transport"

[dependencies]
qbase.workspace = true
qrecovery.workspace = true
qcongestion.workspace = true
qevent.workspace = true
qtls.workspace = true
qprotocol.workspace = true
bytes.workspace = true
dashmap.workspace = true
derive_more.workspace = true
futures.workspace = true
smallvec.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
thiserror.workspace = true

[dev-dependencies]
qrecovery = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "io-util", "net"] }
tls-backend = { package = "qrustls", version = "=0.23.45", default-features = false, features = ["std", "ring"] }
