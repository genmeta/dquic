[package]
name = "dquic"
version = "0.8.1"
edition.workspace = true
readme = "README.md"
description = "QUIC connection APIs for decentralized endpoint connectivity"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
qbase.workspace = true
qconnection.workspace = true
qprotocol.workspace = true
qresolve.workspace = true
qtls.workspace = true
qtransport.workspace = true

[dev-dependencies]
clap.workspace = true
netwatcher.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["rt", "macros", "io-util", "signal", "fs", "time"] }

[features]
interop-test = ["qconnection/interop-test"]

[[example]]
name = "interop"
path = "interop/main.rs"
required-features = ["interop-test"]

[[test]]
name = "interop"
path = "interop/tests.rs"
required-features = ["interop-test"]
